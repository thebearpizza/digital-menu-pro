<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lito Loader</title>
<style>
  :root {
    --bg: #ece8e1;
    --paper: #fbf8f2;
    --paper-edge: #e9e2d4;
    --ink: #111111;
    --cycle: 5.2s;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #16161a; }
  }
  :root[data-theme="dark"] { --bg: #16161a; }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    display: grid;
    place-items: center;
    font-family: system-ui, sans-serif;
    overflow: hidden;
  }

  .stage { perspective: 1400px; padding: 16px; animation: center var(--cycle) cubic-bezier(.45,.05,.25,1) infinite; }
  @keyframes center {
    0%, 8% { transform: translateX(0); }
    54%, 100% { transform: translateX(50%); }
  }

  .book {
    position: relative;
    width: min(42vw, 300px);
    aspect-ratio: 3 / 4;
    transform-style: preserve-3d;
    transform: rotateX(8deg);
  }

  /* Pagina base: dove compare il logo */
  .leaf {
    position: absolute; inset: 0;
    border-radius: 2px 6px 6px 2px;
    background:
      radial-gradient(120% 90% at 30% 20%, rgba(255,255,255,.7), transparent 60%),
      linear-gradient(90deg, rgba(0,0,0,.10), transparent 8%, transparent 92%, rgba(0,0,0,.04)),
      var(--paper);
    box-shadow:
      0 1px 0 var(--paper-edge),
      0 2px 0 #e2dacb,
      0 3px 0 var(--paper-edge),
      0 4px 0 #ddd4c3,
      0 24px 40px -12px rgba(0,0,0,.35);
  }
  .grain::after {
    content: ""; position: absolute; inset: 0; border-radius: inherit;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .4  0 0 0 0 .35  0 0 0 0 .28  0 0 0 .09 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    mix-blend-mode: multiply; pointer-events: none;
  }

  .logo {
    position: absolute; inset: 18% 16% 22%;
    width: 68%; height: auto;
    overflow: visible;
  }
  .logo .ink { fill: var(--ink); }
  .logo .pen {
    fill: none; stroke: #fff; stroke-width: 4.6;
    stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 1; stroke-dashoffset: 1;
    animation: write var(--cycle) cubic-bezier(.55,.1,.35,1) infinite;
  }
  .wordmark {
    position: absolute; left: 0; right: 0; bottom: 12%;
    text-align: center; letter-spacing: .42em; text-indent: .42em;
    font: 500 11px/1 Georgia, "Times New Roman", serif;
    color: #6b6357; text-transform: uppercase;
    opacity: 0; animation: fadeWord var(--cycle) ease infinite;
  }

  /* Pagina che si sfoglia: copertina sul fronte, retro di carta */
  .page {
    position: absolute; inset: 0;
    transform-origin: left center;
    transform-style: preserve-3d;
    animation: turn var(--cycle) cubic-bezier(.45,.05,.25,1) infinite;
  }
  .face {
    position: absolute; inset: 0;
    backface-visibility: hidden;
    border-radius: 2px 6px 6px 2px;
    overflow: hidden;
  }
  .front {
    background:
      linear-gradient(90deg, rgba(0,0,0,.18), transparent 6%),
      radial-gradient(120% 80% at 70% 10%, rgba(255,255,255,.55), transparent 55%),
      var(--paper);
    display: grid; place-items: center;
  }
  .front .rule {
    width: 46%; aspect-ratio: 1; border: 1px solid rgba(17,17,17,.18);
    border-radius: 50%;
    display: grid; place-items: center;
    font: italic 400 13px Georgia, serif; color: rgba(17,17,17,.45);
    letter-spacing: .2em;
  }
  .back {
    transform: rotateY(180deg);
    background:
      linear-gradient(270deg, rgba(0,0,0,.14), transparent 10%),
      var(--paper);
  }
  /* Ombra dinamica sulla pagina che si piega */
  .front::before, .back::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(90deg, transparent 20%, rgba(0,0,0,.28) 100%);
    opacity: 0; animation: shade var(--cycle) ease-in-out infinite;
  }
  /* Ombra proiettata sulla pagina sottostante */
  .cast {
    position: absolute; inset: 0; pointer-events: none;
    border-radius: 2px 6px 6px 2px;
    background: linear-gradient(90deg, rgba(0,0,0,.30), transparent 70%);
    opacity: 0; animation: cast var(--cycle) ease-in-out infinite;
  }

  @keyframes turn {
    0%, 8%   { transform: rotateY(0deg) skewY(0deg); }
    30%      { transform: rotateY(-70deg) skewY(-3deg); }
    46%      { transform: rotateY(-150deg) skewY(1deg); }
    54%, 86% { transform: rotateY(-180deg) skewY(0deg); }
    100%     { transform: rotateY(-180deg); }
  }
  @keyframes shade {
    0%, 8% { opacity: 0; } 30% { opacity: 1; } 50%, 100% { opacity: 0; }
  }
  @keyframes cast {
    0%, 8% { opacity: 0; } 26% { opacity: 1; } 50%, 100% { opacity: 0; }
  }
  @keyframes write {
    0%, 22% { stroke-dashoffset: 1; }
    72%, 90% { stroke-dashoffset: 0; }
    100% { stroke-dashoffset: 0; }
  }
  @keyframes fadeWord {
    0%, 70% { opacity: 0; transform: translateY(4px); }
    80%, 90% { opacity: 1; transform: none; }
    100% { opacity: 0; }
  }
  .book { animation: fadeAll var(--cycle) ease infinite; }
  @keyframes fadeAll {
    0% { opacity: 0; } 5% { opacity: 1; } 92% { opacity: 1; } 100% { opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .page { display: none; }
    .logo .pen { animation: none; stroke-dashoffset: 0; }
    .wordmark, .book { animation: none; opacity: 1; }
  }
</style>
</head>
<body>
  <div class="stage" role="img" aria-label="Caricamento">
    <div class="book">
      <div class="leaf grain">
        <svg class="logo" viewBox="0 0 50 50" aria-hidden="true">
          <defs>
            <mask id="pen" maskUnits="userSpaceOnUse" x="-5" y="-5" width="60" height="60">
              <path class="pen" pathLength="1" d="
                M30.4 22.4
                C34 19.5 40 15.5 44 12.5
                C46.8 10.2 45 7.6 41.5 8.2
                C37 9 33 11.5 30.5 15.5
                C26.5 21.5 24 28 19.2 32.8
                C16 34.5 11 34 7.8 35.5
                C5 37 5.3 40 8.8 40.2
                C12.5 40.4 17 37.5 20.5 34.8
                C26 37 31 40 37 40
                C41 40 43.5 37.8 44.8 36" />
            </mask>
          </defs>
          <path class="ink" mask="url(#pen)" d="m44.64 35.88c-2.07 1.87-4.98 2.83-7.76 2.830-5.43 0-10.09-2.8-14.39-4.56 3.09-3.22 5.32-7.98 7.34-12.61 1.55-3.49 3.02-6.41 5.3-8.86 1.76-1.84 4.06-3.2 6.03-3.2 1.27 0 1.97 0.78 1.97 1.84 0 4-6.45 9.45-12.76 11.56-0.22 0.08-0.16 0.31 0.12 0.3 8.4-0.73 15.68-6.16 15.67-10.87-0.01-2.42-1.9-3.86-5.04-3.86-4.56 0-9.68 2.68-13.21 7.3-3.66 4.79-5.49 11.38-9.17 17.15-1.75-0.46-3.56-0.68-5.25-0.68-5.21 0-9.6 2.66-9.6 5.73 0 2.11 1.91 3.2 4.48 3.2 4.31 0 8.94-2.8 12.01-5.27 4.27 2.26 8.96 5.67 14.47 5.67 5.72 0 9.42-3.27 10.110-5.27 0.09-0.28-0.16-0.54-0.32-0.4zm-33.53 3.18c-1.53-0.04-2.4-0.84-2.4-2.03 0-1.82 2.17-3.31 4.94-3.31 1.46 0 2.9 0.4 3.97 0.87-1.82 2.62-4.38 4.5-6.51 4.47z"/>
        </svg>
        <div class="wordmark">Lito</div>
      </div>
      <div class="cast"></div>
      <div class="page">
        <div class="face front grain"><div class="rule">Menu</div></div>
        <div class="face back grain"></div>
      </div>
    </div>
  </div>
</body>
</html>
